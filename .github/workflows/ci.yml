# CI：全量 pytest + 覆盖率红线（README 要求 >80%）
# - test   ：纯 Python 链路（不编译 C++，奇门/六爻测试自动 skip）
# - cpp-cli：编译 ZhouYiLab CLI（Linux LLVM/libc++）后跑全量测试，
#            奇门/六爻链路真实执行，防止 C++ 侧回归被 skip 掩盖
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检出六壬引擎所需子模块
        run: git submodule update --init third_party/dalurenpython

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install astropy
          pip install git+https://github.com/wlhyl/ganzhiwuxinForPython.git

      - name: 测试（含覆盖率红线 80%）
        run: pytest --cov --cov-fail-under=80

  cpp-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检出所需子模块（ZhouYiLab + dalurenpython）
        run: git submodule update --init third_party/ZhouYiLab third_party/dalurenpython

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装 Python 依赖与构建工具
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt cmake ninja
          pip install astropy
          pip install git+https://github.com/wlhyl/ganzhiwuxinForPython.git

      - name: 安装 LLVM 20（libc++ 工具链）
        run: |
          sudo apt-get update
          sudo apt-get install -y lsb-release wget gnupg
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y libc++-20-dev libc++abi-20-dev
          clang++-20 --version

      - name: 编译 ZhouYiLab CLI（example_zhouyi_cli）
        run: |
          cd third_party/ZhouYiLab
          # 编译到 build/：这是 zhouyi_bridge 的第一候选路径，
          # cli_available() 直接走文件探测，不依赖环境变量注入
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang-20 \
            -DCMAKE_CXX_COMPILER=clang++-20 \
            -DBUILD_EXAMPLES=ON \
            -DZHOUYILAB_MODULE_MODE=LOCAL \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target example_zhouyi_cli

      - name: CLI 冒烟（bridge 真实调用一次）
        run: |
          python - <<'PY'
          from engines import zhouyi_bridge
          assert zhouyi_bridge.cli_available(), "bridge 未发现 CLI（build/examples/example_zhouyi_cli）"
          r = zhouyi_bridge.calculate_qi_men({"year": 2024, "month": 3, "day": 5, "hour": 10, "minute": 0})
          assert r["ok"], f"奇门排盘失败: {r}"
          print("CLI 冒烟通过：", zhouyi_bridge._resolve_binary())
          PY

      - name: 全量测试（奇门/六爻真实链路）
        run: |
          set -o pipefail
          pytest -q -rs | tee /tmp/pytest.out
          # 本 job 的意义就是真实执行奇门/六爻链路：出现 skip 说明 CLI 未生效，必须报错
          if grep -q "skipped" /tmp/pytest.out; then
            echo "::error::cpp-cli job 出现 skip，奇门/六爻链路未真实执行"
            exit 1
          fi
