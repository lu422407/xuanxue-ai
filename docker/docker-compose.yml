services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      XUANXUE_API_KEYS: ${XUANXUE_API_KEYS:-dev-key-0001}
      DATABASE_URL: postgresql+psycopg2://xuanxue:xuanxue@postgres:5432/xuanxue
    depends_on:
      - postgres
      - redis
      - vector-db

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: xuanxue
      POSTGRES_PASSWORD: xuanxue
      POSTGRES_DB: xuanxue
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  vector-db:
    image: qdrant/qdrant:v1.12
    ports:
      - "6333:6333"

  llm-service:
    image: vllm/vllm-openai:latest
    command: --model Qwen/Qwen2.5-7B-Instruct --port 8001
    ports:
      - "8001:8001"
    shm_size: 8g

volumes:
  pgdata: